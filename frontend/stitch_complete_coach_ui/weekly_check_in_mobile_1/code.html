<div class="flex items-center gap-3">
<span class="text-xl font-black italic tracking-tighter text-zinc-900 font-headline">MCP</span>
</div>
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full overflow-hidden">

</div>
<span class="material-symbols-outlined text-zinc-500 hover:opacity-80 transition-opacity cursor-pointer">notifications</span>
</div>

<main class="pt-24 px-6 max-w-md mx-auto">
<!-- Header Section -->
<section class="mb-10">
<div class="flex justify-between items-end mb-2">
<h1 class="text-3xl font-extrabold tracking-tight font-headline text-on-surface">Weekly Check-in</h1>
<span class="text-primary font-bold font-headline text-lg italic">Week 12</span>
</div>
<div class="h-1.5 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-gradient-to-r from-primary to-primary-container rounded-full"></div>
</div>
</section>
<!-- Step 1: Biometrics -->
<section class="mb-12">
<div class="flex items-center gap-2 mb-6">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-primary text-white text-[10px] font-bold">1</span>
<h2 class="text-xl font-bold font-headline tracking-tight">Biometrics</h2>
</div>
<div class="bg-surface-container-lowest p-8 rounded-3xl shadow-[0_10px_30px_rgba(27,28,28,0.06)] flex flex-col items-center gap-4 relative overflow-hidden">
<div class="absolute top-0 right-0 p-4">
<span class="material-symbols-outlined text-primary/10 text-6xl rotate-12 select-none">monitor_weight</span>
</div>
<label class="text-sm font-semibold text-on-surface-variant uppercase tracking-widest" for="weight">Current Weight</label>
<div class="flex items-baseline gap-2">
<input class="w-32 text-5xl font-black font-headline text-center bg-transparent border-none focus:ring-0 p-0 text-on-surface" id="weight" placeholder="00.0" type="text" value="00.0">
<span class="text-xl font-bold text-outline">kg</span>
</div>
<div class="flex items-center gap-2 px-4 py-2 bg-secondary-container/10 rounded-full border border-secondary-container/20">
<span class="material-symbols-outlined text-secondary-container text-sm" style="font-variation-settings: 'FILL' 1;">trending_down</span>
<span class="text-secondary-container font-bold text-sm">-0.8kg since last week</span>
</div>
</div>
</section>

<section class="mb-12">
<div class="flex items-center gap-2 mb-6">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-primary text-white text-[10px] font-bold">2</span>
<h2 class="text-xl font-bold font-headline tracking-tight">Progress Photos</h2>
</div>
<div class="grid grid-cols-3 gap-3">
<!-- Front -->
<div class="group relative aspect-[3/4] rounded-2xl bg-surface-container-high flex flex-col items-center justify-center gap-2 border-2 border-dashed border-outline-variant hover:border-primary/50 transition-colors cursor-pointer overflow-hidden">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">add_a_photo</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Front</span>
</div>
<!-- Side -->
<div class="group relative aspect-[3/4] rounded-2xl bg-surface-container-high flex flex-col items-center justify-center gap-2 border-2 border-dashed border-outline-variant hover:border-primary/50 transition-colors cursor-pointer overflow-hidden">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">add_a_photo</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Side</span>
</div>
<!-- Back -->
<div class="group relative aspect-[3/4] rounded-2xl bg-surface-container-high flex flex-col items-center justify-center gap-2 border-2 border-dashed border-outline-variant hover:border-primary/50 transition-colors cursor-pointer overflow-hidden">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">add_a_photo</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-on-surface-variant">Back</span>
</div>
</div>
<p class="mt-4 text-xs text-on-surface-variant text-center leading-relaxed">Ensure lighting is consistent with your Week 0 photos for accurate comparison.</p>
</section>
<!-- Step 3: Performance & Recovery -->
<section class="mb-12">
<div class="flex items-center gap-2 mb-6">
<span class="flex items-center justify-center w-6 h-6 rounded-full bg-primary text-white text-[10px] font-bold">3</span>
<h2 class="text-xl font-bold font-headline tracking-tight">Performance &amp; Recovery</h2>
</div>
<div class="space-y-8">
<div>
<label class="block text-sm font-bold text-on-surface mb-4">How was your overall energy this week?</label>
<div class="grid grid-cols-4 gap-2">
<button class="flex flex-col items-center gap-2 py-4 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-95 group">
<span class="material-symbols-outlined text-zinc-400 group-hover:text-zinc-600">sentiment_dissatisfied</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-zinc-500">Poor</span>
</button>
<button class="flex flex-col items-center gap-2 py-4 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-95 group">
<span class="material-symbols-outlined text-zinc-400 group-hover:text-zinc-600">sentiment_neutral</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-zinc-500">Fair</span>
</button>
<button class="flex flex-col items-center gap-2 py-4 rounded-2xl bg-secondary-container/10 border border-secondary-container/30 transition-all active:scale-95 group">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">sentiment_satisfied</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-secondary-container">Good</span>
</button>
<button class="flex flex-col items-center gap-2 py-4 rounded-2xl bg-surface-container-low hover:bg-surface-container-high transition-all active:scale-95 group">
<span class="material-symbols-outlined text-zinc-400 group-hover:text-zinc-600">sentiment_very_satisfied</span>
<span class="text-[10px] font-bold uppercase tracking-tighter text-zinc-500">Elite</span>
</button>
</div>
</div>
<div>
<label class="block text-sm font-bold text-on-surface mb-3" for="feedback">Coach's Notes &amp; Feedback</label>
<textarea class="w-full rounded-2xl bg-surface-container-high border-none focus:ring-2 focus:ring-primary/20 text-on-surface p-4 text-sm placeholder:text-outline" id="feedback" placeholder="Tell us about your sleep, stress, or any difficulties during workouts..." rows="4"></textarea>
</div>
</div>
</section>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 w-full px-6 pb-8 pt-4 bg-gradient-to-t from-background via-background to-transparent pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto">
<button class="w-full py-5 bg-gradient-to-br from-primary to-primary-container text-white rounded-3xl font-bold font-headline text-lg shadow-[0_20px_40px_rgba(54,32,184,0.3)] hover:scale-[0.98] active:scale-95 transition-all flex items-center justify-center gap-3">SUBMIT<br><span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
