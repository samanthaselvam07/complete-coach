services:
  postgres:
    image: postgres:16-alpine
    container_name: complete-coach-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-completecoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-completecoach_local}
      POSTGRES_DB: ${POSTGRES_DB:-completecoach}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-completecoach} -d ${POSTGRES_DB:-completecoach}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: complete-coach-postgres-data
